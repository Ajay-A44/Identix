{% extends "base.html" %}

{% block title %}
Student Login | Identix
{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-mark">
            S
        </div>

        <div class="eyebrow">
            STUDENT PORTAL
        </div>

        <h1>
            Welcome back
        </h1>

        <p class="auth-subtitle">
            Sign in to manage your verification requests.
        </p>


        {% if error %}

            <div class="alert alert-error">
                {{ error }}
            </div>

        {% endif %}


        <form
            method="POST"
            class="auth-form"
        >

            <div class="form-group">

                <label for="usn">
                    USN
                </label>

                <input
                    type="text"
                    id="usn"
                    name="usn"
                    class="form-control"
                    placeholder="Enter your USN"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary btn-full"
            >
                Sign in →
            </button>

        </form>


        <a
            href="{{ url_for('index') }}"
            class="back-link centered-link"
        >
            ← Back to home
        </a>

    </div>

</div>

{% endblock %}
